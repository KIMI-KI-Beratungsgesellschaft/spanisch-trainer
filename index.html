<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spanisch-Trainer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f9f9f7;color:#111;min-height:100vh}
#app{max-width:640px;margin:0 auto;padding:16px 12px}
.header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.title{font-size:18px;font-weight:600}.subtitle{font-size:12px;color:#888;margin-top:2px}
.pills{display:flex;gap:16px}
.pill .val{font-size:18px;font-weight:600;text-align:center}
.pill .lbl{font-size:11px;color:#888;text-align:center}
.save-bar{background:#fff;border:1px solid #e8e8e8;border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.save-bar span{font-size:12px;color:#888;flex:1}
.save-btn{padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer;font-weight:500;border:none}
.btn-export{background:#111;color:#fff}
.btn-import{background:#f0f0f0;color:#111}
.btn-import:hover,.btn-export:hover{opacity:.85}
.progress-track{height:4px;background:#e5e5e5;border-radius:2px;margin-bottom:12px;overflow:hidden}
.progress-fill{height:100%;background:#22c55e;border-radius:2px;transition:width .4s}
.tabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
.tab{padding:5px 12px;border:1px solid #d0d0d0;border-radius:20px;font-size:12px;cursor:pointer;background:transparent;color:#111}
.tab.active{background:#111;color:#fff;border-color:#111;font-weight:500}
.tab:hover:not(.active){background:#f0f0f0}
.session-row{display:flex;gap:10px;align-items:center;margin-bottom:10px;font-size:13px;color:#888}
.session-row button{margin-left:auto;background:transparent;border:none;cursor:pointer;font-size:16px;color:#aaa}
.card-area{border:1px solid #e8e8e8;border-radius:12px;padding:22px 18px;min-height:200px;position:relative;background:#fff;display:flex;flex-direction:column;align-items:center}
.dir-badge{position:absolute;top:10px;left:12px;font-size:11px;color:#ccc}
.q-lang{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;margin-top:4px}
.question{font-size:26px;font-weight:600;text-align:center;line-height:1.3;margin-bottom:14px}
.flip-btn{padding:10px 28px;border:1px solid #d0d0d0;border-radius:8px;font-size:15px;cursor:pointer;background:transparent;color:#111}
.flip-btn:hover{background:#f5f5f5}
.a-lang{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.08em;margin-top:10px;margin-bottom:4px;align-self:flex-start}
.answer{font-size:22px;font-weight:600;align-self:flex-start;margin-bottom:8px}
.ex-btn{font-size:12px;color:#999;border:none;background:transparent;cursor:pointer;text-decoration:underline;align-self:flex-start;padding:4px 0}
.ex-loading{font-size:13px;color:#aaa;font-style:italic;align-self:flex-start}
.ex-box{background:#f7f7f5;border-radius:8px;border-left:3px solid #d0d0d0;padding:8px 12px;width:100%;margin-top:6px}
.ex-label{font-size:10px;color:#bbb;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:3px}
.ex-text{font-size:13px;line-height:1.5;white-space:pre-wrap}
.rate-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;margin-top:14px}
.rate-btn{padding:10px 4px;border-radius:8px;font-size:13px;cursor:pointer;border:none;font-weight:500}
.rate-btn:hover{opacity:.85}
.rate-again{background:#fee2e2;color:#991b1b}
.rate-hard{background:#fef3c7;color:#92400e}
.rate-good{background:#dcfce7;color:#166534}
.rate-easy{background:#dbeafe;color:#1e40af}
.mc-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;width:100%;margin-top:12px}
.mc-btn{padding:12px 10px;border:1px solid #e8e8e8;border-radius:8px;font-size:14px;cursor:pointer;text-align:left;line-height:1.3;background:#fff}
.mc-btn:hover:not(:disabled){background:#f5f5f5}
.mc-correct{background:#dcfce7!important;border:2px solid #16a34a!important;color:#166534}
.mc-wrong{background:#fee2e2!important;border:2px solid #dc2626!important;color:#991b1b}
.type-row{display:flex;gap:8px;width:100%;margin-top:10px}
.type-input{flex:1;padding:10px 12px;border:1px solid #d0d0d0;border-radius:8px;font-size:16px;outline:none;background:#fff;color:#111}
.type-input:focus{border-color:#111}
.type-submit{padding:10px 16px;border:none;border-radius:8px;background:#111;color:#fff;font-size:15px;cursor:pointer}
.type-feedback{font-size:14px;font-weight:500;align-self:flex-start;margin-top:10px;width:100%}
.feedback-ok{color:#166534}.feedback-ko{color:#991b1b}
.btn-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.next-btn{padding:9px 16px;border-radius:8px;font-size:13px;cursor:pointer;font-weight:500}
.btn-primary{background:#111;color:#fff;border:none}
.btn-green{background:#dcfce7;color:#166534;border:none}
.btn-red{background:#fee2e2;color:#991b1b;border:none}
.done-screen{text-align:center;padding:40px 16px}
.done-screen h2{font-size:22px;font-weight:600;margin-bottom:8px}
.done-screen p{font-size:15px;color:#888;margin-bottom:4px}
.done-btns{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.done-btns button{padding:11px 24px;border-radius:8px;font-size:15px;cursor:pointer}
.kbd{font-size:11px;opacity:.4;margin-left:6px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}
.toast.show{opacity:1}
@media(max-width:480px){
  .question{font-size:22px}
  .rate-row{grid-template-columns:repeat(2,1fr)}
  .mc-grid{grid-template-columns:1fr}
}
</style>
</head>

  return VOCAB.map((_,i)=>({idx:i,interval:0,ef:2.5,due:0,step:0,state:'new',lapses:0}));
}
function saveCards(c){
  try{localStorage.setItem(SK,JSON.stringify(c));}catch(e){}
}

function exportProgress(){
  const data=JSON.stringify({version:1,date:new Date().toISOString(),cards:cards});
  const blob=new Blob([data],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  const d=new Date();
  a.download=`spanisch_fortschritt_${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('✅ Fortschritt gespeichert!');
}

function importProgress(e){
  const file=e.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(ev){
    try{
      const data=JSON.parse(ev.target.result);
      if(data.cards&&data.cards.length===VOCAB.length){
        cards=data.cards;
        saveCards(cards);
        sess={reviewed:0,correct:0};
        showToast('✅ Fortschritt geladen!');
        advance();
      }else{
        showToast('❌ Datei passt nicht (falsche Vokabelzahl)');
      }
    }catch(err){showToast('❌ Ungültige Datei');}
    e.target.value='';
  };
  reader.readAsText(file);
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

// ── SRS ───────────────────────────────────────────────────────
function getQueues(c){
  const now=Date.now();
  return{
    due:c.filter(x=>x.state==='review'&&x.due<=now),
    learn:c.filter(x=>x.state==='learning'&&x.due<=now),
    newCards:c.filter(x=>x.state==='new')
  };
}
function pickNext(c){
  const now=Date.now();
  const learn=c.filter(x=>x.state==='learning').sort((a,b)=>a.due-b.due);
  if(learn.length&&learn[0].due<=now)return learn[0];
  const due=c.filter(x=>x.state==='review'&&x.due<=now);
  if(due.length)return due[Math.floor(Math.random()*due.length)];
  const newC=c.filter(x=>x.state==='new');
  if(newC.length)return newC[0];
  return null;
}
function applyRating(card,rating){
  const now=Date.now();const c={...card};
  if(rating==='again'){c.lapses++;c.state='learning';c.step=0;c.due=now+STEPS[0]*60000;}
  else if(rating==='hard'){
    if(c.state!=='review'){c.step=Math.max(0,c.step-1);c.due=now+STEPS[c.step]*60000;}
    else{c.ef=Math.max(1.3,c.ef-0.15);c.interval=Math.max(1,Math.round(c.interval*1.2));c.due=now+c.interval*86400000;}
  }else if(rating==='good'){
    if(c.state==='new'||c.state==='learning'){
      c.step++;
      if(c.step>=STEPS.length){c.state='review';c.interval=1;c.due=now+86400000;}
      else{c.state='learning';c.due=now+STEPS[c.step]*60000;}
    }else{c.ef=Math.min(3.0,c.ef);c.interval=Math.max(2,Math.round(c.interval*c.ef));c.due=now+c.interval*86400000;}
  }else{
    c.state='review';c.ef=Math.min(3.0,c.ef+0.15);
    const base=(c.interval||1);c.interval=Math.max(4,Math.round(base*c.ef*1.3));c.due=now+c.interval*86400000;
  }
  return c;
}
function getMCOptions(idx,al){
  const correct=al==='es'?VOCAB[idx][1]:VOCAB[idx][0];
  const used=new Set([idx]);const pool=[];
  while(pool.length<3){const r=Math.floor(Math.random()*VOCAB.length);if(!used.has(r)){used.add(r);pool.push(al==='es'?VOCAB[r][1]:VOCAB[r][0]);}}
  return [...pool,correct].sort(()=>Math.random()-0.5);
}
async function fetchExample(de,es){
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:120,
        system:'Du bist ein Spanisch-Lernassistent. Gib genau einen kurzen Beispielsatz auf Spanisch (max. 10 Wörter) mit dem Vokabel, dann die deutsche Übersetzung. Nur dieses Format:\nES: <satz>\nDE: <übersetzung>',
        messages:[{role:'user',content:`Vokabel: "${es}" (${de})`}]})});
    const d=await res.json();
    return d.content?.find(c=>c.type==='text')?.text?.trim()||'';
  }catch(e){return '';}
}

// ── State ─────────────────────────────────────────────────────
let cards=loadCards();
let mode='flash',dir='both';
let currentCard=null,currentDir='de→es';
let flipped=false,mcOptions=[],mcSelected=null;
let typeInput='',typeResult=null,exState=null;
let sess={reviewed:0,correct:0};
let exCache={};
let lastSaved=null;

function advance(){
  currentCard=pickNext(cards);
  currentDir=dir==='both'?(Math.random()<0.5?'de→es':'es→de'):dir;
  flipped=false;mcSelected=null;typeInput='';typeResult=null;exState=null;
  if(mode==='mc'&&currentCard)mcOptions=getMCOptions(currentCard.idx,currentDir==='de→es'?'es':'de');
  render();
  if(mode==='type'&&!typeResult){const el=document.getElementById('type-input');if(el){el.focus();}}
}
function rate(rating){
  if(!currentCard)return;
  cards=cards.map(c=>c.idx===currentCard.idx?applyRating(c,rating):c);
  saveCards(cards);sess.reviewed++;
  if(rating==='good'||rating==='easy')sess.correct++;
  advance();
}
function handleMCSelect(opt){
  if(mcSelected!==null||!currentCard)return;
  mcSelected=opt;
  const al=currentDir==='de→es'?'es':'de';
  const correct=al==='es'?VOCAB[currentCard.idx][1]:VOCAB[currentCard.idx][0];
  const ok=opt===correct;
  sess.reviewed++;if(ok)sess.correct++;
  render();
  setTimeout(()=>{
    cards=cards.map(c=>c.idx===currentCard.idx?applyRating(c,ok?'good':'again'):c);
    saveCards(cards);advance();
  },900);
}
function handleTypeSubmit(){
  if(!typeInput.trim()||typeResult||!currentCard)return;
  const al=currentDir==='de→es'?'es':'de';
  const correct=(al==='es'?VOCAB[currentCard.idx][1]:VOCAB[currentCard.idx][0]).toLowerCase().trim();
  const input=typeInput.toLowerCase().trim();
  const norm=s=>s.replace(/^(el |la |los |las |¿)/,'').trim();
  const ok=norm(input)===norm(correct)||(correct.includes(input)&&input.length>2);
  typeResult=ok?'correct':'wrong';
  sess.reviewed++;if(ok)sess.correct++;
  render();
}
function handleTypeNext(override){
  const rating=override||(typeResult==='correct'?'good':'again');
  cards=cards.map(c=>c.idx===currentCard.idx?applyRating(c,rating):c);
  saveCards(cards);advance();
}
function loadExample(){
  if(!currentCard||exState==='loading')return;
  const[de,es]=VOCAB[currentCard.idx];
  const key=de+'|'+es;
  if(exCache[key]){exState=exCache[key];render();return;}
  exState='loading';render();
  fetchExample(de,es).then(text=>{exState=text||'Kein Beispiel verfügbar.';exCache[key]=exState;render();});
}
function resetAll(){
  if(!confirm('SRS-Daten zurücksetzen?'))return;
  cards=VOCAB.map((_,i)=>({idx:i,interval:0,ef:2.5,due:0,step:0,state:'new',lapses:0}));
  saveCards(cards);sess={reviewed:0,correct:0};advance();
}
function setMode(m){mode=m;advance();}
function setDir(d){dir=d;advance();}

document.addEventListener('keydown',e=>{
  if(mode==='flash'){
    if(!flipped&&e.code==='Space'){e.preventDefault();flipped=true;render();}
    else if(flipped){
      if(e.key==='1')rate('again');
      else if(e.key==='2')rate('hard');
      else if(e.key==='3')rate('good');
      else if(e.key==='4')rate('easy');
    }
  }
  if(mode==='type'&&e.key==='Enter'){if(!typeResult)handleTypeSubmit();else handleTypeNext();}
});

// ── Render ────────────────────────────────────────────────────
function escHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function escAttr(s){return String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");}

function renderSaveBar(){
  const d=new Date();
  const ts=`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  const learned=cards.filter(c=>c.state!=='new').length;
  return `<div class="save-bar">
  <span>💾 Fortschritt sichern — ${learned} von ${VOCAB.length} Karten gelernt</span>
  <button class="save-btn btn-export" onclick="exportProgress()">⬇ Exportieren</button>
  <button class="save-btn btn-import" onclick="document.getElementById('file-input').click()">⬆ Importieren</button>
</div>`;
}

function render(){
  const app=document.getElementById('app');
  const q=getQueues(cards);
  const prog=Math.round((cards.filter(c=>c.state!=='new').length/VOCAB.length)*100);

  if(!currentCard){
    app.innerHTML=renderSaveBar()+`<div class="done-screen">
  <div style="font-size:48px;margin-bottom:12px">🎉</div>
  <h2>Sitzung abgeschlossen!</h2>
  <p>${sess.reviewed} Karten · ${sess.correct} korrekt</p>
  <p style="font-size:13px;color:#bbb">${cards.filter(c=>c.state==='review').length} im Wiederholungsstapel</p>
  <div class="done-btns">
    <button class="btn-primary" style="border:none" onclick="advance()">Weiter üben</button>
    <button style="border:1px solid #ccc;background:transparent" onclick="resetAll()">Zurücksetzen</button>
  </div>
</div>`;
    return;
  }

  const[de,es]=VOCAB[currentCard.idx];
  const question=currentDir==='de→es'?de:es;
  const answer=currentDir==='de→es'?es:de;
  const qLang=currentDir==='de→es'?'🇩🇪 Deutsch':'🇪🇸 Español';
  const aLang=currentDir==='de→es'?'🇪🇸 Español':'🇩🇪 Deutsch';

  let html=renderSaveBar()+`
<div class="header">
  <div><div class="title">🇪🇸 Spanisch-Trainer</div><div class="subtitle">${VOCAB.length} Vokabeln · ${prog}% gelernt</div></div>
  <div class="pills">
    <div class="pill"><div class="val" style="color:#3b82f6">${q.newCards.length}</div><div class="lbl">Neu</div></div>
    <div class="pill"><div class="val" style="color:#f59e0b">${q.learn.length}</div><div class="lbl">Lernen</div></div>
    <div class="pill"><div class="val" style="color:#22c55e">${q.due.length}</div><div class="lbl">Fällig</div></div>
  </div>
</div>
<div class="progress-track"><div class="progress-fill" style="width:${prog}%"></div></div>
<div class="tabs">
  <button class="tab ${mode==='flash'?'active':''}" onclick="setMode('flash')">Karteikarte</button>
  <button class="tab ${mode==='mc'?'active':''}" onclick="setMode('mc')">Multiple Choice</button>
  <button class="tab ${mode==='type'?'active':''}" onclick="setMode('type')">Eingabe</button>
  <div style="flex:1"></div>
  <button class="tab ${dir==='both'?'active':''}" onclick="setDir('both')">↔</button>
  <button class="tab ${dir==='de→es'?'active':''}" onclick="setDir('de→es')">DE→ES</button>
  <button class="tab ${dir==='es→de'?'active':''}" onclick="setDir('es→de')">ES→DE</button>
</div>
<div class="session-row">
  <span>✅ ${sess.correct}</span><span>📖 ${sess.reviewed}</span>
  <button onclick="resetAll()" title="Zurücksetzen">↺</button>
</div>
<div class="card-area">
  <div class="dir-badge">${currentDir}</div>
  <div class="q-lang">${qLang}</div>
  <div class="question">${escHtml(question)}</div>`;

  if(mode==='flash'){
    if(!flipped){
      html+=`<button class="flip-btn" onclick="flipped=true;render()">Aufdecken <span class="kbd">Space</span></button>`;
    }else{
      html+=`<div class="a-lang">${aLang}</div><div class="answer">${escHtml(answer)}</div>`;
      if(exState===null)html+=`<button class="ex-btn" onclick="loadExample()">💡 Beispielsatz laden</button>`;
      else if(exState==='loading')html+=`<div class="ex-loading">Lade Beispielsatz…</div>`;
      else html+=`<div class="ex-box"><span class="ex-label">Beispiel</span><span class="ex-text">${escHtml(exState)}</span></div>`;
      html+=`<div class="rate-row">
  <button class="rate-btn rate-again" onclick="rate('again')">Nochmal<span style="display:block;font-size:11px;opacity:.6">1</span></button>
  <button class="rate-btn rate-hard" onclick="rate('hard')">Schwer<span style="display:block;font-size:11px;opacity:.6">2</span></button>
  <button class="rate-btn rate-good" onclick="rate('good')">Gut<span style="display:block;font-size:11px;opacity:.6">3</span></button>
  <button class="rate-btn rate-easy" onclick="rate('easy')">Leicht<span style="display:block;font-size:11px;opacity:.6">4</span></button>
</div>`;
    }
  }else if(mode==='mc'){
    const al=currentDir==='de→es'?'es':'de';
    const correct=al==='es'?VOCAB[currentCard.idx][1]:VOCAB[currentCard.idx][0];
    html+=`<div class="mc-grid">`;
    mcOptions.forEach(opt=>{
      let cls='mc-btn';
      if(mcSelected!==null){if(opt===correct)cls+=' mc-correct';else if(opt===mcSelected)cls+=' mc-wrong';}
      html+=`<button class="${cls}" onclick="handleMCSelect('${escAttr(opt)}')" ${mcSelected!==null?'disabled':''}>${escHtml(opt)}</button>`;
    });
    html+=`</div>`;
  }else{
    html+=`<div class="a-lang">${aLang} eingeben:</div>
<div class="type-row">
  <input id="type-input" class="type-input" value="${escHtml(typeInput)}"
    oninput="typeInput=this.value"
    onkeydown="if(event.key==='Enter'){if(!typeResult)handleTypeSubmit();else handleTypeNext();}"
    placeholder="Antwort eingeben…" ${typeResult?'disabled':''}>
  ${!typeResult?'<button class="type-submit" onclick="handleTypeSubmit()">✓</button>':''}
</div>`;
    if(typeResult==='correct'){
      html+=`<div class="type-feedback feedback-ok">✅ Richtig! <em style="margin-left:6px">${escHtml(answer)}</em>
<div class="btn-row"><button class="next-btn btn-primary" onclick="handleTypeNext()">Weiter →</button></div></div>`;
    }else if(typeResult==='wrong'){
      html+=`<div class="type-feedback feedback-ko">❌ Richtig wäre: <strong>${escHtml(answer)}</strong>
<div class="btn-row">
  <button class="next-btn btn-green" onclick="handleTypeNext('good')">War richtig</button>
  <button class="next-btn btn-red" onclick="handleTypeNext('again')">War falsch</button>
</div></div>`;
    }
  }

  html+=`</div>`;
  app.innerHTML=html;
  if(mode==='type'&&!typeResult){const el=document.getElementById('type-input');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);}}
}

advance();
</script>
</body>
</html>
